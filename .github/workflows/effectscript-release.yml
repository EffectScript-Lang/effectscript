# EffectScript standalone binaries (ADR-0037, ADR-0038): build on an `effectscript@<version>` tag,
# smoke-test, attach to a GitHub release with SHASUMS256.txt and install.sh, then update the
# formula in EffectScript-Lang/homebrew-tap (needs the HOMEBREW_TAP_TOKEN secret).
name: EffectScript release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag, such as effectscript@4.0.0-alpha.1
        required: true
  push:
    tags: ["effectscript@*"]

concurrency:
  group: effectscript-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          # macOS binaries are built (and ad-hoc signed by Bun) on macOS
          - runner: macos-latest
            targets: --target darwin-arm64 --target darwin-x64
            native: darwin-arm64
          - runner: ubuntu-latest
            targets: >-
              --target linux-x64 --target linux-arm64 --target linux-x64-musl
              --target linux-arm64-musl --target windows-x64
            native: linux-x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TAG }}
      - name: Install dependencies
        uses: ./.github/actions/setup
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Check that the tag matches the package version
        working-directory: packages/effectscript/core
        run: test "effectscript@$(node -p 'require("./package.json").version')" = "$TAG"
      - name: Build
        working-directory: packages/effectscript/core
        run: node scripts/standalone.ts build ${{ matrix.targets }}
      - name: Smoke-test the native binary
        working-directory: packages/effectscript/core
        env:
          NATIVE: ${{ matrix.native }}
        run: |
          ./dist-bin/efx-"$NATIVE" --version
          dir="$(mktemp -d)"
          printf 'const n: number = 40 + 2\nconsole.log(n)\n' > "$dir/app.efx"
          test "$(cd "$dir" && "$OLDPWD/dist-bin/efx-$NATIVE" run app.efx)" = 42
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: efx-${{ matrix.runner }}
          path: packages/effectscript/core/dist-bin/efx-*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      # a tag run by hand for an older version doesn't become "latest"; prereleases sort before
      # their release
      - name: Is this the newest release?
        id: latest
        run: |
          newest="$(git -c versionsort.suffix=- tag --list 'effectscript@*' --sort=-v:refname | head -1)"
          echo "latest=$([ "$newest" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: efx-*
          merge-multiple: true
          path: packages/effectscript/core/dist-bin
      - name: Package
        working-directory: packages/effectscript/core
        run: |
          chmod +x dist-bin/efx-*
          node scripts/standalone.ts package
          cp distribution/install.sh dist-bin/install.sh
      # releases stay "latest" (not prereleases) during alpha, so install.sh's latest/download works;
      # a re-run replaces the assets of the release it made
      - name: Create the release
        working-directory: packages/effectscript/core
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          assets=(dist-bin/*.tar.gz dist-bin/*.zip dist-bin/SHASUMS256.txt dist-bin/install.sh)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${assets[@]}"
            gh release edit "$TAG" --latest="$LATEST"
          else
            gh release create "$TAG" --verify-tag --latest="$LATEST" --title "EffectScript ${TAG#effectscript@}" \
              --notes "Install: curl -fsSL https://effectscript.dev/install | sh, or brew install effectscript-lang/tap/effectscript" \
              "${assets[@]}"
          fi

  homebrew:
    name: Homebrew tap
    needs: release
    # the tap's formula follows the newest release only
    if: needs.release.outputs.latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: EffectScript-Lang/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern SHASUMS256.txt --dir "$RUNNER_TEMP"
          mkdir -p tap/Formula
          node packages/effectscript/core/scripts/homebrew.ts --version "${TAG#effectscript@}" \
            --shasums "$RUNNER_TEMP/SHASUMS256.txt" > tap/Formula/effectscript.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/effectscript.rb
          # a re-run with the same formula has nothing to commit
          git diff --cached --quiet && exit 0
          git commit -m "effectscript ${TAG#effectscript@}"
          git push
